
services:
  postgres:
    image: postgres:15
    container_name: bravo-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotnet
      POSTGRES_PASSWORD: bravo
      POSTGRES_DB: bravo_db
    ports:
      - "5432:5432"
    volumes:
      - bravo-postgres-data:/var/lib/postgresql/data
    networks:
      - bravo_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: bravo-pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - bravo_net

volumes:
  bravo-postgres-data:

networks:
  bravo_net: